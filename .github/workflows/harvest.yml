name: Harvest roadmap

on:
  schedule:
    # 05:17 UTC daily — off the hour so we are not competing with every other cron.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Harvest roadmap snapshot
        run: npm run harvest

      - name: Commit snapshot
        run: |
          # meta.json carries a fresh harvestedAt on every run, so it always differs.
          # Only roadmap.json tells us whether Microsoft actually changed anything —
          # that keeps `git log -p -- data/roadmap.json` a clean roadmap changelog.
          today=$(date -u +%Y-%m-%d)
          count=$(node -p "require('./data/meta.json').featureCount")

          if git diff --quiet -- data/roadmap.json; then
            message="chore: roadmap unchanged ${today}"
          else
            message="data: roadmap changed ${today} (${count} features)"
          fi

          if git diff --quiet -- data; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "$message"
          git push
          echo "$message"
